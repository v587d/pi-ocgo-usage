name: Pi AI Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pi-agent:
    uses: badlogic/pi-agent-action/.github/workflows/pi.yml@v1
    with:
      allowed_actor: v587d
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      token: ${{ secrets.LLM_API_KEY }}
