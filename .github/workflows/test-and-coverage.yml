name: Test and coverage

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    inputs:
      coverage:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  test-and-coverage:
    name: Test and Coverage
    runs-on: ubuntu-latest
    # Skip routine docs/status commits from the PR tracker ([skip ci])
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Test and coverage
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        if: ${{ github.ref == 'refs/heads/master' || inputs.coverage }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
          use_oidc: true
