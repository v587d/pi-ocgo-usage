name: Release

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: write

jobs:
  test-and-coverage:
    uses: ./.github/workflows/test-and-coverage.yml

  release:
    name: semantic-release
    runs-on: ubuntu-latest
    needs: test-and-coverage
    # Skip routine docs/status commits from the PR tracker ([skip ci])
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # semantic-release needs full history to analyze commits/tags
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup Node (needed for npm publish)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Deliberately NO registry-url: it writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` (empty, since
          # NODE_AUTH_TOKEN is never set) to $RUNNER_TEMP/.npmrc. The npm
          # plugin's registry-auth-token then sees a truthy "token", skips
          # writing the real NPM_TOKEN, and `npm whoami` fails with 401
          # (EINVALIDNPMTOKEN). Auth comes from NPM_TOKEN env alone.

      - name: Diagnostic - npm token fingerprint
        # TEMPORARY: compare CI-side NPM_TOKEN against the locally verified
        # token (len=40, sha256=b0ad0c20523a6935). Remove after release works.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "NPM_TOKEN length: ${#NPM_TOKEN}"
          echo "NPM_TOKEN sha256: $(printf '%s' "$NPM_TOKEN" | sha256sum | cut -c1-16)"

      - name: Semantic Release
        # Run the repo's own semantic-release toolchain (semantic-release 25 +
        # @semantic-release/npm 13, verified against npm granular access
        # tokens). The previous cycjimmy/semantic-release-action@v6 bundles its
        # own older @semantic-release/npm which rejects granular tokens with
        # "Invalid npm token" (see semantic-release/npm#215).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Defensive: drop any userconfig pointer (setup-node leftover) so the
          # npm plugin writes NPM_TOKEN itself.
          unset NPM_CONFIG_USERCONFIG
          npx --no-install semantic-release
