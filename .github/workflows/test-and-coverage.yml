name: Test and coverage

on:
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      coverage:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  test-and-coverage:
    name: Test and Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run checks
        run: bun run check
      - name: Test and coverage
        run: bun test
